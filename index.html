<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Dex - Custom Orders & Testing Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Futuristic Floating Header -->
  <header>
    <h1>3Dex</h1>
    <h3 class="subtitle">Custom CAD & Onshape Designs</h3>
  </header>

  <main>
    
    <!-- 1. TESTING SIGN-IN BOX SECTION -->
    <section class="glass-card form-container">
      <h2 class="section-title">Testing Sign-In Box</h2>
      <p style="margin-bottom: 20px; font-size: 0.9rem; opacity: 0.8;">Simulate user login and authentication credentials.</p>
      
      <form onsubmit="handleTestLogin(event)" class="custom-form">
        <div class="form-group">
          <label for="test-email">Test Username / Email</label>
          <input type="email" id="test-email" name="test_email" placeholder="tester@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="test-password">Test Password</label>
          <input type="password" id="test-password" name="test_password" placeholder="Enter test password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-long btn-submit" style="background: rgba(0, 212, 255, 0.25); border-color: #00d4ff;">Simulate Sign In</button>
      </form>
      <div id="login-feedback" style="margin-top: 15px; font-size: 0.9rem; font-weight: bold; color: #00ff88;"></div>
    </section>


    <!-- 2. WEB3FORMS ORDER & CONTACT SECTION -->
    <section class="glass-card form-container">
      <h2 class="section-title">Request a Custom Design</h2>
      <p style="margin-bottom: 20px;">Submit project details directly via Web3Forms.</p>

      <form action="https://api.web3forms.com/submit" method="POST" class="custom-form">
        
        <!-- Web3Forms Access Key -->
        <input type="hidden" name="access_key" value="8b77c291-bdef-4300-9c3d-1973dd3b6e83">
        <input type="hidden" name="subject" value="New 3Dex Custom CAD Order Request">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email">Your Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="message">Project Description</label>
          <textarea id="message" name="message" rows="4" placeholder="Describe dimensions, file type needed (STL, STEP), etc." required></textarea>
        </div>

        <button type="submit" class="btn-long btn-submit">Submit Order Request</button>
      </form>
    </section>

    <!-- 3. FUTURISTIC NAVIGATION BACK TO HOME -->
    <div style="margin-top: 30px; text-align: center;">
      <a href="index.html" class="btn-futuristic-home">
        <span class="glow-icon">⚡</span> Return to 3Dex Home Hub
      </a>
    </div>

  </main>

  <!-- JavaScript for Mock Login Feedback -->
  <script>
    function handleTestLogin(event) {
      event.preventDefault();
      const email = document.getElementById('test-email').value;
      const feedback = document.getElementById('login-feedback');
      feedback.textContent = `✅ Test login successful for: ${email} (Mock session active)`;
    }
  </script>

</body>
</html>
