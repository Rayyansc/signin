<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3Dex - Custom CAD Orders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>3Dex</h1>
    <h3 class="subtitle">Custom CAD & Onshape Designs</h3>
  </header>

  <main>
    
    <!-- WEB3FORMS ORDER & CONTACT SECTION (Only Box Kept) -->
    <section class="glass-card form-container">
      <h2 class="section-title">Request a Custom Design</h2>
      <p style="margin-bottom: 20px; font-size: 0.9rem; opacity: 0.85;">Submit project details directly via Web3Forms.</p>

      <form action="https://api.web3forms.com/submit" method="POST" class="custom-form">
        
        <!-- Web3Forms Access Key & Config -->
        <input type="hidden" name="access_key" value="8b77c291-bdef-4300-9c3d-1973dd3b6e83">
        <input type="hidden" name="subject" value="⚡ New 3Dex CAD Order Request">
        <input type="hidden" name="from_name" value="3Dex Website Order">

        <!-- Form Input Fields -->
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="email">Your Email Address</label>
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="message">Business & Project Description</label>
          <textarea id="message" name="message" rows="5" placeholder="Describe dimensions, file types (STL, STEP), or business requirements..." required></textarea>
        </div>

        <!-- Automated Green Accept & Red Reject Action Buttons for Email Notifications -->
        <input type="hidden" name="🟢 1. Click to ACCEPT Order" value="mailto:{{email}}?subject=Your%203Dex%20Order%20has%20been%20ACCEPTED!&body=Hi%20{{name}},%0D%0A%0D%0AWe%20have%20reviewed%20your%20CAD%20project%20request%20and%20are%20thrilled%20to%20accept!%20We%20will%20begin%20processing%20your%20transaction%20shortly.%0D%0A%0D%0ABest%20regards,%0D%0A3Dex%20Team">
        
        <input type="hidden" name="🔴 2. Click to REJECT Order" value="mailto:{{email}}?subject=Update%20regarding%20your%203Dex%20Order&body=Hi%20{{name}},%0D%0A%0D%0AThank%20you%20for%20submitting%20your%20CAD%20project%20request.%20Unfortunately,%20we%20are%20unable%20to%20accept%20this%20order%20at%20this%20time.%0D%0A%0D%0ABest%20regards,%0D%0A3Dex%20Team">

        <button type="submit" class="btn-long btn-submit">Submit Order Request</button>
      </form>
    </section>

    <!-- FUTURISTIC RETURN TO MAIN HOMEPAGE LINK -->
    <div style="margin: 35px 0 20px 0; text-align: center;">
      <a href="https://rayyansc.github.io/3Dex1/" class="btn-futuristic-home">
        <span class="glow-icon">⚡</span> Return to 3Dex Home Hub
      </a>
    </div>

  </main>

</body>
</html>
